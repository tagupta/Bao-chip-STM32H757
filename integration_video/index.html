<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Kakute ↔ Dabao (Baochip-1x) wiring – narrated 360° walkthrough</title>
<style>
  html, body { margin:0; background:#0b0e13; overflow:hidden; font-family: "Helvetica Neue", Arial, sans-serif; }
  #wrap { position:relative; width:1280px; height:720px; }
  canvas { display:block; }
  .ov { position:absolute; color:#fff; pointer-events:none; }
  #title { left:28px; top:20px; }
  #title h1 { margin:0; font-size:26px; font-weight:700; letter-spacing:.2px; text-shadow:0 2px 8px #000; }
  #title h2 { margin:4px 0 0; font-size:15px; font-weight:500; color:#9fb3c8; text-shadow:0 2px 8px #000; }
  #caption { left:0; right:0; bottom:0; padding:18px 28px 34px; background:linear-gradient(0deg, rgba(5,8,12,.94) 0%, rgba(5,8,12,.8) 70%, rgba(5,8,12,0) 100%); }
  #caption .step { font-size:13px; letter-spacing:2px; text-transform:uppercase; color:#ffcf4a; font-weight:700; }
  #caption .main { font-size:25px; font-weight:600; margin-top:4px; text-shadow:0 2px 6px #000; }
  #caption .sub { font-size:16px; color:#c5d2e0; margin-top:4px; }
  #table { right:22px; top:22px; width:350px; background:rgba(8,12,18,.78); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:10px 12px; font-size:13px; }
  #table .hd { font-size:11px; letter-spacing:1.5px; color:#8fa3b8; text-transform:uppercase; margin-bottom:6px; }
  #table .row { display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:6px; opacity:.35; }
  #table .row.on { opacity:1; }
  #table .row.cur { background:rgba(255,255,255,.12); opacity:1; }
  #table .sw { width:26px; height:6px; border-radius:3px; flex:none; }
  #table .txt { line-height:1.25; }
  #table .txt b { color:#fff; }
  #table .txt span { color:#9fb3c8; }
  #foot { left:28px; bottom:8px; font-size:11px; color:#7f92a6; }
  #summary { inset:0; background:rgba(6,9,14,.84); display:none; }
  #summary .card { position:absolute; left:60px; right:60px; top:40px; bottom:150px; }
  #summary h3 { font-size:28px; margin:0 0 12px; }
  #summary .cols { display:flex; gap:18px; }
  #summary .col { flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:12px 16px; font-size:14px; line-height:1.5; }
  #summary .col h4 { margin:0 0 6px; font-size:17px; color:#ffcf4a; }
  #summary table { width:100%; border-collapse:collapse; font-size:14px; }
  #summary td { padding:2px 4px; border-bottom:1px solid rgba(255,255,255,.1); }
  #summary code { color:#bfe3ff; font-size:13px; }
  #prog { left:0; bottom:0; height:4px; background:#ffcf4a; width:0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="title" class="ov"><h1 id="t1"></h1><h2 id="t2"></h2></div>
  <div id="table" class="ov"></div>
  <div id="summary" class="ov"><div class="card" id="sumcard"></div></div>
  <div id="caption" class="ov"><div class="step" id="cstep"></div><div class="main" id="cmain"></div><div class="sub" id="csub"></div></div>
  <div id="foot" class="ov">Illustrative 3D model – pad/connector placement not to scale. Always confirm against your boards' silkscreen.</div>
  <div id="prog" class="ov"></div>
</div>

<script src="./beats.js"></script>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('wrap').prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.Fog(0x0d1117, 280, 560);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, W/H, 1, 1000);

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(-70, 140, 90);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left:-140, right:110, top:110, bottom:-120, near:10, far:420 });
sun.shadow.bias = -0.0004;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9bb8ff, 0x203040, 0.5));

// ---------- table surface -----------
{
  const c = document.createElement('canvas'); c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = '#1b2a3a'; g.fillRect(0,0,1024,1024);
  g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 2;
  for (let i=0;i<=32;i++){ g.beginPath(); g.moveTo(i*32,0); g.lineTo(i*32,1024); g.stroke(); g.beginPath(); g.moveTo(0,i*32); g.lineTo(1024,i*32); g.stroke(); }
  g.strokeStyle = 'rgba(255,255,255,.14)';
  for (let i=0;i<=4;i++){ g.beginPath(); g.moveTo(i*256,0); g.lineTo(i*256,1024); g.stroke(); g.beginPath(); g.moveTo(0,i*256); g.lineTo(1024,i*256); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3,3); t.anisotropy = 8; t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.CircleGeometry(420, 64).rotateX(-Math.PI/2),
    new THREE.MeshStandardMaterial({ map:t, roughness:.9, metalness:0 }));
  m.position.y = -0.05; m.receiveShadow = true; scene.add(m);
}

// ---------- helpers -----------
const gold = new THREE.MeshStandardMaterial({ color:0xd8a93a, metalness:1, roughness:.28 });
const holeMat = new THREE.MeshStandardMaterial({ color:0x050505, roughness:1 });
const solder = new THREE.MeshStandardMaterial({ color:0xdadde2, metalness:1, roughness:.25 });
const black = new THREE.MeshStandardMaterial({ color:0x111214, roughness:.5, metalness:.2 });
const steel = new THREE.MeshStandardMaterial({ color:0xb9bfc7, metalness:1, roughness:.3 });
const white = new THREE.MeshStandardMaterial({ color:0xe8e8e0, roughness:.6 });
const PCB_T = 1.6;
const ease = x => x<0?0:x>1?1:x*x*(3-2*x);
const clamp01 = x => Math.min(1, Math.max(0, x));

function box(w,h,d,mat,x,y,z,parent){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }
function pad(parent,x,z,r=1.25){
  const p = new THREE.Mesh(new THREE.CylinderGeometry(r,r,.14,24), gold); p.position.set(x,PCB_T+.07,z); p.receiveShadow = true; parent.add(p);
  const h = new THREE.Mesh(new THREE.CylinderGeometry(r*.45,r*.45,.16,16), holeMat); h.position.set(x,PCB_T+.08,z); parent.add(h);
}
function sprite(text, color='#ffffff', bg='rgba(10,14,20,.86)', h=4.2){
  const c = document.createElement('canvas'); const g = c.getContext('2d');
  const fs = 54; g.font = `700 ${fs}px "Helvetica Neue", Arial`;
  const tw = Math.ceil(g.measureText(text).width); c.width = tw + 60; c.height = fs + 34;
  g.font = `700 ${fs}px "Helvetica Neue", Arial`;
  g.fillStyle = bg; g.beginPath(); g.roundRect(2,2,c.width-4,c.height-4,22); g.fill();
  g.strokeStyle = color; g.lineWidth = 5; g.stroke();
  g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, 30, c.height/2+2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:t, depthTest:false, transparent:true }));
  s.scale.set(h * c.width / c.height, h, 1); s.renderOrder = 10;
  return s;
}
// A cable that can be "drawn" along its length (p = 0..1).
function cable(points, color, rad=.5, tension=.5){
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', tension);
  const SEG = 160, RAD = 10;
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, SEG, rad, RAD, false),
    new THREE.MeshStandardMaterial({ color, roughness:.35, metalness:.05 }));
  mesh.castShadow = true; mesh.visible = false; scene.add(mesh);
  return { curve, mesh, set(p){ mesh.visible = p>0.001; mesh.geometry.setDrawRange(0, Math.floor(clamp01(p)*SEG)*RAD*6); } };
}

// ---------- Dabao -----------
const dabao = new THREE.Group(); scene.add(dabao);
const DW = 21, DL = 46, ROW = 2.54, PX = 8.89;
const leftPins  = ['PC13','PC12','GND','PC11','PC10','PC9','PC8','GND','PC7','PC3','PC2','PC1','GND','PC0','PB14 TX','PB13 RX'];
const rightPins = ['VBUS','VSYS','GND','EN','3V3','PB5','PB4','GND','PB3','PB2','RUN','PB1','GND','PB11','PB12','GND'];
const pinZ = i => -19.05 + i*ROW;
const pinPos = (side, i) => new THREE.Vector3(side==='L' ? -PX : PX, PCB_T, pinZ(i));
{
  box(DW, PCB_T, DL, new THREE.MeshStandardMaterial({ color:0x0f7a3d, roughness:.45, metalness:.1 }), 0, PCB_T/2, 0, dabao);
  for (let i=0;i<16;i++){ pad(dabao,-PX,pinZ(i)); pad(dabao,PX,pinZ(i)); }
  const ppm = 40, c = document.createElement('canvas'); c.width = DW*ppm; c.height = DL*ppm; const g = c.getContext('2d');
  g.font = `600 ${1.05*ppm}px "Helvetica Neue", Arial`; g.textBaseline = 'middle';
  const hi = { 'PB13 RX':'#ffe34d', 'PB14 TX':'#7fe8ff', 'VSYS':'#ff6b6b' };
  const cy = i => (pinZ(i) + DL/2) * ppm;
  leftPins.forEach((t,i)=>{ g.textAlign='left'; g.fillStyle = hi[t] || (t==='GND'?'#cfd8cf':'#f2fff2'); g.fillText(t, (DW/2-PX+1.9)*ppm, cy(i)); });
  rightPins.forEach((t,i)=>{ g.textAlign='right'; g.fillStyle = hi[t] || (t==='GND'?'#cfd8cf':'#f2fff2'); g.fillText(t, (DW/2+PX-1.9)*ppm, cy(i)); });
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
  const ov = new THREE.Mesh(new THREE.PlaneGeometry(DW, DL).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ map:tx, transparent:true, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 }));
  ov.position.y = PCB_T + .02; dabao.add(ov);
  box(5,.8,5,black,0,PCB_T+.4,-2,dabao);
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.05,12), new THREE.MeshStandardMaterial({color:0xcccccc})); dot.position.set(-1.7,PCB_T+.82,-3.7); dabao.add(dot);
  box(3.2,.9,2.5,steel,0,PCB_T+.45,4.5,dabao);
  for (const z of [-15.5, 20.6]){
    box(4.2,1.5,4.2,black,0,PCB_T+.75,z,dabao);
    const b = new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,1,24), new THREE.MeshStandardMaterial({color:0xffc400,roughness:.4}));
    b.position.set(0,PCB_T+2,z); b.castShadow = true; dabao.add(b);
  }
  box(7.5,2.8,5.5,steel,0,PCB_T+1.4,-21.2,dabao);                     // USB receptacle
  box(5.6,.9,3,holeMat,0,PCB_T+1.4,-23.5,dabao);
}
const dabaoTitle = sprite('DABAO  (Baochip-1x)', '#8dff9e', 'rgba(10,20,14,.88)', 5); dabaoTitle.position.set(0, 16, 30); scene.add(dabaoTitle);

// ---------- Flight controllers -----------
const PAD_WORLD_X = -40;
const PAD_WORLD_Z = { V5:-6, G:8, R:14, T:20 };
function makeFC(kind){
  const cfg = kind==='wing'
    ? { w:45, d:30, name:'KAKUTE H743-WING', uart:2, pcb:0x16191f, label:'Kakute H743-Wing' }
    : { w:36, d:36, name:'KAKUTE H7  V1.5',  uart:4, pcb:0x14171c, label:'Kakute H7 V1.5' };
  const gz = 6;
  const cx = PAD_WORLD_X - (cfg.w/2 - 3);
  const grp = new THREE.Group(); grp.position.set(cx, 0, gz);
  box(cfg.w, PCB_T, cfg.d, new THREE.MeshStandardMaterial({ color:cfg.pcb, roughness:.4, metalness:.15 }), 0, PCB_T/2, 0, grp);
  const lx = cfg.w/2 - 3;
  const padsLocal = { V5:[lx, PAD_WORLD_Z.V5-gz], G:[lx, PAD_WORLD_Z.G-gz], R:[lx, PAD_WORLD_Z.R-gz], T:[lx, PAD_WORLD_Z.T-gz] };
  Object.values(padsLocal).forEach(([x,z])=>pad(grp,x,z,1.3));
  box(9,1,9,black,-4,PCB_T+.5,-2,grp);
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(.35,.35,.05,12), new THREE.MeshStandardMaterial({color:0xaaaaaa})); dot.position.set(-7.4,PCB_T+1.02,-5.4); grp.add(dot);
  box(3.5,.9,3.5,black,6,PCB_T+.45,-8,grp);
  let usbLocal;
  if (kind==='wing'){
    box(11,4,4.5,white,-6,PCB_T+2,cfg.d/2-4.2,grp);
    box(7,4,4.5,white,8,PCB_T+2,cfg.d/2-4.2,grp);
    box(6,3.5,4.5,white,-cfg.w/2+6,PCB_T+1.75,-cfg.d/2+4,grp);            // USB JST-SH (to dongle)
    for (let i=0;i<14;i++) box(1.6,.12,1.6,gold,-cfg.w/2+5+i*2.35,PCB_T+.06,-cfg.d/2+1.6,grp);
    usbLocal = new THREE.Vector3(-cfg.w/2+6, PCB_T+1.75, -cfg.d/2+1.7);
  } else {
    box(9,3.5,4,white,-2,PCB_T+1.75,cfg.d/2-3.5,grp);
    box(5,3,3.5,white,-cfg.w/2+5,PCB_T+1.5,-cfg.d/2+3,grp);
    box(8,2.6,6,steel,-cfg.w/2+14,PCB_T+1.3,-cfg.d/2+2.6,grp);           // on-board USB-C
    for (const [x,z] of [[-1,-1],[1,-1],[-1,1],[1,1]]) { const h = new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,PCB_T+.3,20), gold); h.position.set(x*(cfg.w/2-3.2), PCB_T/2, z*(cfg.d/2-3.2)); grp.add(h); }
    usbLocal = new THREE.Vector3(-cfg.w/2+14, PCB_T+1.3, -cfg.d/2-.4);
  }
  const ppm = 30, c = document.createElement('canvas'); c.width = cfg.w*ppm; c.height = cfg.d*ppm; const g = c.getContext('2d');
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3; g.strokeRect(10,10,c.width-20,c.height-20);
  g.fillStyle = '#ffffff'; g.font = `700 ${2.1*ppm}px "Helvetica Neue", Arial`; g.textBaseline='middle';
  g.textAlign = 'left'; g.fillText(cfg.name, 3*ppm, 3.6*ppm + (kind==='wing'?0:3*ppm));
  g.font = `700 ${1.35*ppm}px "Helvetica Neue", Arial`; g.textAlign='right';
  const U = cfg.uart;
  [['V5','5V','#ff6b6b'],['G','G','#dddddd'],['R','R'+U,'#7fe8ff'],['T','T'+U,'#ffe34d']].forEach(([k,t,col])=>{ g.fillStyle = col; g.fillText(t, (padsLocal[k][0]+cfg.w/2-2.2)*ppm, (padsLocal[k][1]+cfg.d/2)*ppm); });
  const tx = new THREE.CanvasTexture(c); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 8;
  const ov = new THREE.Mesh(new THREE.PlaneGeometry(cfg.w,cfg.d).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({ map:tx, transparent:true, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 }));
  ov.position.y = PCB_T+.02; grp.add(ov);
  const title = sprite(cfg.label, '#ffcf4a', 'rgba(24,18,4,.88)', 5); title.position.set(cx, 16, gz + cfg.d/2 + 12);
  scene.add(title); scene.add(grp);
  const usbWorld = usbLocal.clone().add(grp.position);
  return { grp, title, cfg, U, usbWorld };
}
const FC = { wing: makeFC('wing'), v15: makeFC('v15') };

// ---------- FC ↔ Dabao wires -----------
const WIRE_DEFS = [
  { id:'gnd', color:0x1c1c1c, css:'#8a8a8a', from:'G',  to:['L',12], arch:9  },
  { id:'pwr', color:0xe23b3b, css:'#ff5a5a', from:'V5', to:['R',1],  arch:17, via:true },
  { id:'t2r', color:0xffd21f, css:'#ffe34d', from:'T',  to:['L',15], arch:12 },
  { id:'r2t', color:0x22c7f2, css:'#5fdcff', from:'R',  to:['L',14], arch:15 },
];
const defOf = id => WIRE_DEFS.find(w=>w.id===id);
const padWorld = k => new THREE.Vector3(PAD_WORLD_X, PCB_T+.15, PAD_WORLD_Z[k]);
const wires = {};
for (const key of ['wing','v15']){
  wires[key] = WIRE_DEFS.map(d=>{
    const a = padWorld(d.from); const b = pinPos(d.to[0], d.to[1]); b.y += .15;
    const pts = d.via
      ? [a, new THREE.Vector3(a.x+5,d.arch*.7,a.z-3), new THREE.Vector3(-14,d.arch+2,-24), new THREE.Vector3(2,d.arch+4,-30),
         new THREE.Vector3(PX+6,d.arch*.8,-24), new THREE.Vector3(PX,PCB_T+6,b.z), b]
      : [a, new THREE.Vector3(a.x+4,d.arch*.7,a.z), new THREE.Vector3((a.x+b.x)/2,d.arch,(a.z+b.z)/2), new THREE.Vector3(b.x-4,d.arch*.7,b.z), b];
    const c = cable(pts, d.color);
    const b1 = new THREE.Mesh(new THREE.SphereGeometry(1.0,16,12), solder); b1.position.copy(a); b1.scale.y=.55; b1.visible=false; scene.add(b1);
    const b2 = new THREE.Mesh(new THREE.SphereGeometry(1.0,16,12), solder); b2.position.copy(b); b2.scale.y=.55; b2.visible=false; scene.add(b2);
    const pulse = new THREE.Mesh(new THREE.SphereGeometry(.95,16,12), new THREE.MeshBasicMaterial({ color:0xffffff })); pulse.visible = false; scene.add(pulse);
    return { d, c, b1, b2, pulse };
  });
}

// ---------- Dabao pin labels / rings -----------
const dabPinFor = { gnd:pinPos('L',12), pwr:pinPos('R',1), t2r:pinPos('L',15), r2t:pinPos('L',14) };
const dabLabels = { gnd: sprite('GND', '#dddddd'), pwr: sprite('VSYS  (5 V in)', '#ff7b7b'), t2r: sprite('PB13 · UART2_RX', '#ffe34d'), r2t: sprite('PB14 · UART2_TX', '#5fdcff') };
const dabLabelPos = { gnd:[-PX-6, 20, pinZ(12)-8], pwr:[PX+16, 22, pinZ(1)], t2r:[-PX-12, 34, pinZ(15)+10], r2t:[-PX-14, 27, pinZ(14)+5] };
function leader(from, to, color){
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([from,to]), new THREE.LineBasicMaterial({ color, transparent:true, opacity:.75, depthTest:false }));
  l.renderOrder = 9; l.visible = false; scene.add(l); return l;
}
const leaders = {}, rings = {};
for (const id in dabLabels){
  const s = dabLabels[id]; s.position.set(...dabLabelPos[id]); s.visible=false; scene.add(s);
  const col = defOf(id).color===0x1c1c1c ? 0xaaaaaa : defOf(id).color;
  leaders[id] = leader(dabPinFor[id].clone().setY(PCB_T+1), s.position.clone().setY(s.position.y-2.2), col);
  const r = new THREE.Mesh(new THREE.TorusGeometry(1.9,.22,10,32).rotateX(Math.PI/2), new THREE.MeshBasicMaterial({ color: defOf(id).color===0x1c1c1c?0xffffff:defOf(id).color }));
  r.position.copy(dabPinFor[id]).setY(PCB_T+.3); r.visible=false; scene.add(r); rings[id]=r;
}
function showDabPin(id, on, t){ dabLabels[id].visible = on; leaders[id].visible = on; rings[id].visible = on; rings[id].scale.setScalar(1 + .12*Math.sin(t*6)); }

const fcLabels = {};
for (const key of ['wing','v15']){
  const U = FC[key].U; fcLabels[key] = {};
  const specs = { gnd:['G','#dddddd','G',18], pwr:['5V','#ff7b7b','V5',24], t2r:['T'+U+'  (FC TX)','#ffe34d','T',21], r2t:['R'+U+'  (FC RX)','#5fdcff','R',27] };
  for (const id in specs){
    const [t,col,k,y] = specs[id]; const s = sprite(t,col); const p = padWorld(k);
    s.position.set(p.x-10, y, p.z); s.visible=false; scene.add(s);
    fcLabels[key][id] = { s, l: leader(p.clone().setY(PCB_T+1), new THREE.Vector3(s.position.x, y-2.2, s.position.z), 0x999999) };
  }
}

// ---------- "Your Mac" setup props -----------
const mac = new THREE.Group(); scene.add(mac);
const MAC = { x:-32, z:-68 };
const macRight = new THREE.Vector3(MAC.x+20, 1.0, MAC.z+4);
const macRight2 = new THREE.Vector3(MAC.x+20, 1.0, MAC.z+9);
const macLeft = new THREE.Vector3(MAC.x-20, 1.0, MAC.z+4);
const alu = new THREE.MeshStandardMaterial({ color:0xc9ccd1, metalness:.85, roughness:.35 });
box(40,1.6,26,alu,MAC.x,.8,MAC.z,mac);
box(34,.2,11,new THREE.MeshStandardMaterial({color:0x1a1b1e,roughness:.7}),MAC.x,1.7,MAC.z-4,mac);
box(13,.1,7,new THREE.MeshStandardMaterial({color:0xb8bbc0,metalness:.6,roughness:.4}),MAC.x,1.66,MAC.z+7.5,mac);
const lid = new THREE.Group(); lid.position.set(MAC.x, 1.6, MAC.z-13); lid.rotation.x = -0.2; mac.add(lid);
box(40,26,1,alu,0,13,0,lid);
const scrC = document.createElement('canvas'); scrC.width = 1024; scrC.height = 640;
const scrT = new THREE.CanvasTexture(scrC); scrT.colorSpace = THREE.SRGBColorSpace; scrT.anisotropy = 8;
const screen = new THREE.Mesh(new THREE.PlaneGeometry(37,23), new THREE.MeshBasicMaterial({ map:scrT, toneMapped:false }));
screen.position.set(0,13,.52); lid.add(screen);
const macTitle = sprite('Your Mac', '#e6ecf5', 'rgba(20,24,30,.9)', 5); macTitle.position.set(MAC.x, 38, MAC.z); scene.add(macTitle);

const SCREENS = {
  idle: { title:'Terminal', lines:[['$ ','#9fb3c8']] },
  p1: { title:'Terminal — dabao-sdk', lines:[
    ['$ ls /dev/cu.*','#ffffff'], ['/dev/cu.usbmodem1101','#8dff9e'], ['',''],
    ['$ ./bao_flash.sh flash /dev/cu.usbmodem1101 my_app','#ffffff'],
    ['Connecting to boot1 REPL ...','#9fb3c8'], ['Writing my_app.uf2  [##########] 100%','#9fb3c8'], ['Done ✓','#8dff9e'] ] },
  p2: { title:'Terminal — serial console', lines:[
    ['$ .venv/bin/pyserial-miniterm \\','#ffffff'], ['     /dev/cu.usbserial-0001 115200','#ffffff'],
    ['--- Miniterm on /dev/cu.usbserial-0001  115200,8,N,1 ---','#9fb3c8'],
    ['Hello from Dabao!','#8dff9e'], ['tick 1','#8dff9e'], ['tick 2','#8dff9e'] ] },
  p3: { title:'Ground station — Parameters', lines:[
    ['ArduPilot (QGroundControl / Mission Planner)','#ffcf4a'],
    ['  H743-Wing:  SERIAL2_BAUD = 115','#ffffff'], ['  H7 V1.5:    SERIAL4_BAUD = 115','#ffffff'],
    ['  SERIALx_PROTOCOL = your Dabao protocol','#ffffff'], ['',''],
    ['Betaflight / INAV Configurator','#ffcf4a'], ['  Ports tab → UART2 / UART4 → 115200','#ffffff'] ] },
  p4: { title:'Checklist', lines:[
    ['✓ Dabao flashed','#8dff9e'], ['✓ Flight controller configured','#8dff9e'], ['',''],
    ['→ Unplug the Dabao USB cable','#ffcf4a'], ['→ Remove the USB-serial adapter','#ffcf4a'], ['',''],
    ['The FC will power the Dabao via VSYS','#9fb3c8'] ] },
};
let curScreen = null;
function drawScreen(key){
  if (curScreen === key) return; curScreen = key;
  const s = SCREENS[key], g = scrC.getContext('2d');
  g.fillStyle = '#0c1016'; g.fillRect(0,0,1024,640);
  g.fillStyle = '#23262c'; g.fillRect(0,0,1024,58);
  [['#ff5f57',34],['#febc2e',68],['#28c840',102]].forEach(([c,x])=>{ g.fillStyle=c; g.beginPath(); g.arc(x,29,11,0,7); g.fill(); });
  g.fillStyle = '#c8d0da'; g.font = '600 26px "Helvetica Neue", Arial'; g.textAlign='center'; g.fillText(s.title, 512, 38);
  g.textAlign='left'; g.font = '30px Menlo, Monaco, monospace';
  s.lines.forEach(([t,c],i)=>{ g.fillStyle = c || '#fff'; g.fillText(t, 30, 110 + i*62); });
  scrT.needsUpdate = true;
}
drawScreen('idle');

// USB cable Mac → Dabao
const usbDabao = cable([ new THREE.Vector3(0,PCB_T+1.4,-24), new THREE.Vector3(0,2.5,-31), new THREE.Vector3(-3,4,-44), new THREE.Vector3(-8,3,-58), macRight.clone().add(new THREE.Vector3(3,0,0)), macRight ], 0x2a2d33, .7);
const usbDabaoLbl = sprite('USB-C  →  flashing', '#e6ecf5'); usbDabaoLbl.position.set(2, 14, -42); usbDabaoLbl.visible=false; scene.add(usbDabaoLbl);

// USB-serial adapter
const adapter = new THREE.Group(); adapter.position.set(-27, 0, 20); scene.add(adapter);
box(9,1.2,16,new THREE.MeshStandardMaterial({color:0x7a1f2b,roughness:.5}),0,.6,0,adapter);
box(4,1.2,4,black,0,1.8,1,adapter);
box(6,2.4,4,steel,0,1.8,-8.2,adapter);
const ADP = { gnd:new THREE.Vector3(-22.8,1.6,15), tx:new THREE.Vector3(-22.8,1.6,19), rx:new THREE.Vector3(-22.8,1.6,23) };
for (const k in ADP) box(1.6,1.6,1.6,black,ADP[k].x+27-.8,1.6,ADP[k].z-20,adapter);
const adapterLbl = sprite('USB-serial adapter (3.3 V)', '#ff9aa9', 'rgba(30,10,14,.9)'); adapterLbl.position.set(-46, 18, 14); adapterLbl.visible=false; scene.add(adapterLbl);
const adpWires = {
  gnd: cable([ADP.gnd, new THREE.Vector3(-17,6,13), new THREE.Vector3(-12,4,pinZ(12)), pinPos('L',12).setY(PCB_T+.15)], 0x1c1c1c, .4),
  t2r: cable([ADP.tx,  new THREE.Vector3(-17,7,20), new THREE.Vector3(-12,4,pinZ(15)), pinPos('L',15).setY(PCB_T+.15)], 0xffd21f, .4),
  r2t: cable([ADP.rx,  new THREE.Vector3(-17,8,21), new THREE.Vector3(-12,4,pinZ(14)), pinPos('L',14).setY(PCB_T+.15)], 0x22c7f2, .4),
};
const usbAdapter = cable([ new THREE.Vector3(-27,1.8,9.5), new THREE.Vector3(-27,4,2), new THREE.Vector3(-24,6,-20), new THREE.Vector3(-15,4,-45), macRight2.clone().add(new THREE.Vector3(4,0,0)), macRight2 ], 0x2a2d33, .6);

// Kakute H743-Wing USB dongle + cable
const dongle = new THREE.Group(); dongle.position.set(-76, 0, -26); scene.add(dongle);
box(7,1.4,10,new THREE.MeshStandardMaterial({color:0x202226,roughness:.5}),0,.7,0,dongle);
box(5.5,2.2,3,steel,0,1.5,-4.5,dongle);
box(2.5,.5,2.5,new THREE.MeshStandardMaterial({color:0x8899aa}),1.5,1.6,2,dongle);
const fcW = FC.wing.usbWorld;
const jstWing = cable([ fcW.clone(), fcW.clone().add(new THREE.Vector3(0,3,-4)), new THREE.Vector3(-76,3,-17), new THREE.Vector3(-76,1.2,-21) ], 0xe8e8e0, .35);
const usbWing = cable([ new THREE.Vector3(-76,1.5,-31), new THREE.Vector3(-74,4,-42), new THREE.Vector3(-62,3,-58), macLeft.clone().add(new THREE.Vector3(-3,0,0)), macLeft ], 0x2a2d33, .7);
const usbWingLbl = sprite('USB dongle  →  ground station', '#ffcf4a', 'rgba(24,18,4,.88)'); usbWingLbl.position.set(-78, 14, -40); usbWingLbl.visible=false; scene.add(usbWingLbl);

// ---------- timeline -----------
const BEATS = window.BEATS;
const TOTAL = BEATS[BEATS.length-1].t0 + BEATS[BEATS.length-1].dur;
const beatById = Object.fromEntries(BEATS.map(b=>[b.id,b]));
const sceneRange = {};
for (const b of BEATS){ const r = sceneRange[b.scene] ||= { t0:b.t0, t1:b.t0+b.dur }; r.t1 = b.t0 + b.dur; }
const WIRE_BEAT = { wing:{ gnd:'wg', pwr:'wp', t2r:'wt', r2t:'wr', done:'wd' }, v15:{ gnd:'vg', pwr:'vp', t2r:'vt', r2t:'vr', done:'vd' } };
const drawP = (t, b, delay=.4, len=3) => clamp01((t - b.t0 - delay) / Math.min(len, b.dur*.6));

const T1 = document.getElementById('t1'), T2 = document.getElementById('t2');
const CST = document.getElementById('cstep'), CMN = document.getElementById('cmain'), CSB = document.getElementById('csub');
const TAB = document.getElementById('table'), SUM = document.getElementById('summary'), SUMC = document.getElementById('sumcard');

function rowsHTML(head, rows, curId, t){
  let h = `<div class="hd">${head}</div>`;
  for (const r of rows){
    const on = t >= beatById[r.beat].t0;
    h += `<div class="row ${on?'on':''} ${curId===r.beat?'cur':''}"><div class="sw" style="background:${r.css}"></div><div class="txt"><b>${r.a}</b><br><span>${r.b}</span></div></div>`;
  }
  return h;
}
function fcRows(key){
  const U = FC[key].U, B = WIRE_BEAT[key];
  return [
    { beat:B.gnd, css:defOf('gnd').css, a:'FC  G  →  Dabao  GND', b:'left col · row 13' },
    { beat:B.pwr, css:defOf('pwr').css, a:'FC  5V  →  Dabao  VSYS', b:'right col · row 2 (pin 39)' },
    { beat:B.t2r, css:defOf('t2r').css, a:`FC  T${U}  →  Dabao  PB13 (RX)`, b:'left col · row 16 (pin 16)' },
    { beat:B.r2t, css:defOf('r2t').css, a:`Dabao  PB14 (TX)  →  FC  R${U}`, b:'left col · row 15 (pin 15)' },
  ];
}
const PC_ROWS = [
  { beat:'p1', css:'#cfd6e0', a:'Mac USB-C → Dabao USB', b:'flash with bao_flash.sh' },
  { beat:'p2', css:'#ff9aa9', a:'(optional) USB-serial → PB13/PB14/GND', b:'bench test of Dabao output' },
  { beat:'p3', css:'#ffcf4a', a:'Mac USB → Kakute', b:'set UART baud in ground station' },
  { beat:'p4', css:'#8dff9e', a:'Unplug Dabao USB + adapter', b:'FC powers the Dabao from now on' },
];

function summaryHTML(){
  return `<h3>Cheat sheet — both flight controllers use the same 4 wires</h3>
  <div class="cols">
   <div class="col"><h4>Kakute H743-Wing (UART2)</h4>
     <table><tr><td>G</td><td>→ Dabao GND</td></tr><tr><td>5V</td><td>→ Dabao VSYS</td></tr>
     <tr><td>T2</td><td>→ Dabao PB13 (RX)</td></tr><tr><td>R2</td><td>← Dabao PB14 (TX)</td></tr></table>
     <div style="margin-top:6px;color:#9fb3c8">ArduPilot: SERIAL2 · baud 115</div></div>
   <div class="col"><h4>Kakute H7 V1.5 (UART4)</h4>
     <table><tr><td>G</td><td>→ Dabao GND</td></tr><tr><td>5V</td><td>→ Dabao VSYS</td></tr>
     <tr><td>T4</td><td>→ Dabao PB13 (RX)</td></tr><tr><td>R4</td><td>← Dabao PB14 (TX)</td></tr></table>
     <div style="margin-top:6px;color:#9fb3c8">ArduPilot: SERIAL4 · baud 115</div></div>
   <div class="col"><h4>Your Mac</h4>
     1. USB-C → Dabao, press RESET:<br><code>./bao_flash.sh flash /dev/cu.usbmodem… app</code><br>
     2. (bench only) USB-serial → PB13/PB14/GND:<br><code>pyserial-miniterm /dev/cu.usbserial… 115200</code><br>
     3. USB → Kakute: ground station, set UART baud<br>
     4. Unplug Dabao USB + adapter, then wire the FC</div>
  </div>`;
}

function orbit(target, dist, az, el){
  camera.position.set(target.x + dist*Math.cos(el)*Math.sin(az), target.y + dist*Math.sin(el), target.z + dist*Math.cos(el)*Math.cos(az));
  camera.lookAt(target);
}

function hideAll(){
  for (const k in FC){ FC[k].grp.visible = false; FC[k].title.visible = false; FC[k].grp.scale.setScalar(1); FC[k].grp.position.y = 0;
    wires[k].forEach(w=>{ w.c.set(0); w.b1.visible=false; w.b2.visible=false; w.pulse.visible=false; });
    for (const id in fcLabels[k]){ fcLabels[k][id].s.visible=false; fcLabels[k][id].l.visible=false; } }
  for (const id in dabLabels) showDabPin(id, false, 0);
  mac.visible = false; macTitle.visible = false; adapter.visible = false; dongle.visible = false;
  for (const c of [usbDabao, usbAdapter, jstWing, usbWing, ...Object.values(adpWires)]) c.set(0);
  for (const s of [usbDabaoLbl, adapterLbl, usbWingLbl]) s.visible = false;
}

function appear(grp, s){ const a = ease(s/1.2); grp.visible = true; grp.scale.setScalar(Math.max(.001,a)); grp.position.y = (1-a)*-10; }

function showRig(key, t, allDone=false){
  const F = FC[key], B = WIRE_BEAT[key];
  appear(F.grp, allDone ? 9 : t - sceneRange[key].t0);
  F.title.visible = true;
  const done = allDone || t >= beatById[B.done].t0;
  for (const w of wires[key]){
    const b = beatById[B[w.d.id]];
    const p = allDone ? 1 : drawP(t, b);
    w.c.set(p); w.b1.visible = p>0.02; w.b2.visible = p>=1;
    const vis = allDone || t >= b.t0;
    const L = fcLabels[key][w.d.id]; L.s.visible = vis; L.l.visible = vis;
    showDabPin(w.d.id, vis, t);
    if (done && (w.d.id==='t2r'||w.d.id==='r2t')){
      w.pulse.visible = true;
      w.pulse.material.color.set(w.d.id==='t2r'?0xffe34d:0x5fdcff);
      let u = (t*0.45 + (w.d.id==='r2t'?.5:0)) % 1; if (w.d.id==='r2t') u = 1-u;
      w.pulse.position.copy(w.c.curve.getPoint(u));
    }
  }
}

function showPC(t){
  const P = id => beatById[id];
  mac.visible = true; macTitle.visible = true;
  const cur = BEATS.find(b=>t>=b.t0 && t<b.t0+b.dur);
  drawScreen(SCREENS[cur.id] ? cur.id : 'idle');
  const unplug = clamp01((t - P('p4').t0 - 2.0) / 2.5);         // 0 → 1 while cables retract
  // 1: Dabao USB
  usbDabao.set(drawP(t, P('p1'), .8, 3) * (1-unplug));
  usbDabaoLbl.visible = t >= P('p1').t0 + 1.5 && unplug < .5;
  // 2: adapter
  if (t >= P('p2').t0 && unplug < 1){
    appear(adapter, t - P('p2').t0); adapter.position.y = adapter.position.y; adapterLbl.visible = unplug < .5;
    usbAdapter.set(drawP(t, P('p2'), .6, 2.5) * (1-unplug));
    adpWires.t2r.set(drawP(t, P('p2'), 5.0, 2) * (1-unplug));
    adpWires.r2t.set(drawP(t, P('p2'), 7.0, 2) * (1-unplug));
    adpWires.gnd.set(drawP(t, P('p2'), 9.0, 2) * (1-unplug));
    const pinOn = t < P('p3').t0;
    showDabPin('t2r', pinOn && t >= P('p2').t0 + 5, t);
    showDabPin('r2t', pinOn && t >= P('p2').t0 + 7, t);
    showDabPin('gnd', pinOn && t >= P('p2').t0 + 9, t);
    if (unplug > .6) adapter.visible = false;
  }
  // 3: Kakute
  if (t >= P('p3').t0){
    appear(FC.wing.grp, t - P('p3').t0); FC.wing.title.visible = true;
    dongle.visible = true;
    jstWing.set(drawP(t, P('p3'), 1.0, 1.5));
    usbWing.set(drawP(t, P('p3'), 2.2, 2.5));
    usbWingLbl.visible = t >= P('p3').t0 + 3;
  }
}

window.renderAt = function(t){
  t = Math.max(0, Math.min(TOTAL-0.001, t));
  const b = BEATS.find(x=>t>=x.t0 && t<x.t0+x.dur) || BEATS[BEATS.length-1];
  const R = sceneRange[b.scene], u = (t-R.t0)/(R.t1-R.t0);
  hideAll(); SUM.style.display='none'; TAB.style.display='none';
  document.getElementById('prog').style.width = (100*t/TOTAL)+'%';
  CST.textContent = b.step; CMN.textContent = b.main; CSB.textContent = b.sub;
  dabaoTitle.visible = true;

  if (b.scene==='intro'){
    T1.textContent = 'Kakute H743-Wing / H7 V1.5  ↔  Dabao (Baochip-1x)'; T2.textContent = 'Narrated 360° hardware wiring walkthrough';
    const i2 = beatById.i2.t0;
    [['t2r',0.5],['r2t',1.5],['gnd',3],['pwr',3.5]].forEach(([id,d])=>showDabPin(id, t>=i2+d, t));
    orbit(new THREE.Vector3(-4, 2, 2), 92, 2*Math.PI*u, 0.95 - 0.55*(0.5-0.5*Math.cos(2*Math.PI*u)));
  } else if (b.scene==='pc'){
    T1.textContent = 'Connecting to your Mac'; T2.textContent = 'Program & configure each board on its own before wiring them together';
    TAB.style.display='block'; TAB.innerHTML = rowsHTML('Your Mac · setup', PC_ROWS, b.id, t);
    showPC(t);
    orbit(new THREE.Vector3(-34, 4, -26), 178, -0.55 + 1.1*ease(u), 0.78 - 0.1*Math.sin(Math.PI*u));
  } else if (b.scene==='wing' || b.scene==='v15'){
    const key = b.scene;
    T1.textContent = key==='wing' ? 'Kakute H743-Wing  ↔  Dabao' : 'Kakute H7 V1.5  ↔  Dabao';
    T2.textContent = key==='wing' ? 'UART2 (T2 / R2) — ArduPilot SERIAL2' : 'UART4 (T4 / R4) — ArduPilot SERIAL4';
    TAB.style.display='block'; TAB.innerHTML = rowsHTML(`Connections · ${key==='wing'?'H743-Wing':'H7 V1.5'}`, fcRows(key), b.id, t);
    showRig(key, t);
    orbit(new THREE.Vector3(-30, 2, 4), 158, 2*Math.PI*u, 0.9 - 0.45*(0.5-0.5*Math.cos(2*Math.PI*u)));
  } else {
    showRig('v15', t, true);
    T1.textContent = ''; T2.textContent = '';
    SUM.style.display='block'; SUMC.innerHTML = summaryHTML();
    orbit(new THREE.Vector3(-30,2,4), 190, 0.6 + 0.6*u, 0.8);
  }
  renderer.render(scene, camera);
};

window.__TOTAL = TOTAL;
window.__ready = true;

if (location.search.includes('live')){
  const t0 = performance.now();
  const loop = ()=>{ window.renderAt(((performance.now()-t0)/1000) % TOTAL); requestAnimationFrame(loop); };
  loop();
} else {
  window.renderAt(0);
}
</script>
</body>
</html>
